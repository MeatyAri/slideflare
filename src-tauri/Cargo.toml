[package]
name = "slideflare"
version = "0.1.2"
description = "⚡Blazing fast, interactive presentation tool for developers, educators, and creators to build and share beautiful slides effortlessly."
authors = ["meatyari"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "slideflare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Selects the bundled frontend over `devUrl`. Tauri decides between the two from
# this feature alone — NOT from `debug_assertions` — via `dev:
# cfg!(not(feature = "custom-protocol"))` in `tauri-macros`. The Tauri CLI turns
# it on for `tauri build`; a bare `cargo build` does not, which is why
# `slideflare export` needs it explicitly (see `.github/workflows/ci.yml`).
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["full"] }
notify = "8"
negahban = "0.3.1"
twox-hash = "2"
pulldown-cmark = "0"
gray_matter = "0"
regex = "1"
pulldown-latex = "0"
base64 = "0"
mime_guess = "2"
imara-diff = "0.2.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
flate2 = "1"
tar = "0.4"
dirs = "6"
which = "7"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# Platform webview handles, used only by the native PDF export in `export::pdf_*`.
# Versions are pinned to whatever wry/tauri already resolve to so cargo unifies
# them into a single build of each crate rather than adding a second copy.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
webkit2gtk = "2.0"
gtk = "0.18"
glib = "0.18"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  # AttachConsole, so the CLI can print into the terminal that launched it.
  # Release builds set `windows_subsystem = "windows"`, which otherwise leaves
  # the process with no stdout/stderr at all.
  "Win32_System_Console",
] }
windows-core = "0.61"

# objc2-app-kit's printing types and objc2-foundation's NSURL live behind
# features wry does not enable, so they are turned on here.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
  "NSURL",
  "NSString",
  "NSDictionary",
  "NSGeometry",
  "NSObject",
] }
objc2-app-kit = { version = "0.3", features = [
  "NSPrintInfo",
  "NSPrintOperation",
] }
# `printOperationWithPrintInfo:` lives in a `WKWebView` impl block gated behind
# objc2-web-kit's own `objc2-app-kit` feature, which wry does not enable.
objc2-web-kit = { version = "0.3", features = ["WKWebView", "objc2-app-kit"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "slideflare_benchmarks"
harness = false
