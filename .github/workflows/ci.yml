name: 'ci'

# Compile coverage on every change. The publish workflow only runs on `app-v*`
# tags, so without this a Windows- or macOS-only break stays invisible until a
# release is cut. The PDF export backends are implemented three times over
# three unrelated native APIs, and a broken feature flag or signature in any of
# them is caught here rather than on a tag.
#
# See docs/testing-platform-exports.md for what this does and does not cover.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run check

      # Catches build-only breakage (adapter-static, import resolution) that
      # neither svelte-check nor eslint sees.
      - name: Build
        run: bun run build

  rust:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The webkit2gtk/gtk/glib crates resolve system libraries through
      # pkg-config at build time, so these are needed even to type-check.
      # Windows (webview2-com) and macOS (objc2) need no extra packages.
      - name: Install system dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Formatting is platform-independent; checking it once is enough.
      - name: Check formatting
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: src-tauri
        run: cargo fmt --check

      # --all-targets so benches and tests are compiled too, not just the lib.
      # No frontend build is needed first: generate_context! tolerates a missing
      # frontendDist directory (verified by removing build/ and forcing both
      # lib.rs and build.rs to recompile).
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test

  # Tier 2 of docs/testing-platform-exports.md: prove the exports actually
  # render, not merely that they compile — and, in the fidelity step at the end,
  # that what they render is *right*. That last part is the only thing standing
  # behind the windowless export on Windows and macOS, neither of which anyone
  # has been able to run by hand; see docs/headless-export.md.
  #
  # The webview IS the renderer — `print_to_pdf` reaches through `with_webview`
  # to the real WKWebView / ICoreWebView2 / webkit2gtk::WebView, and the HTML
  # export harvests a stylesheet Tailwind only generates at runtime — so this
  # needs a real display on every platform. `slideflare export` is the vehicle
  # rather than a bespoke harness precisely so CI exercises the code users run.
  export-smoke:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # For the fidelity check at the end of this job. pypdfium2 ships the
      # renderer in the wheel, so this is the same two lines on all three
      # runners — unlike poppler or ImageMagick, which would be a different
      # package manager each.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the PDF comparison dependencies
        run: python -m pip install --quiet pypdfium2 pillow

      # xvfb on top of the build dependencies: GTK aborts in `gtk_init` without
      # a display, so there is nothing to print to without it. poppler-utils
      # provides pdfinfo for the structural assertions below.
      - name: Install system dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb poppler-utils

      # Unlike the `rust` job above, this one genuinely needs the frontend: the
      # binary loads it from `frontendDist` and renders it for real.
      - name: Build frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      # `--features custom-protocol` is load-bearing and easy to miss. Tauri
      # picks `devUrl` over the bundled frontend from that feature alone (see
      # `dev: cfg!(not(feature = "custom-protocol"))` in tauri-macros) — NOT
      # from debug_assertions — so without it even a release build points at
      # localhost and every export fails with "Connection refused".
      - name: Build slideflare
        working-directory: src-tauri
        run: cargo build --release --features custom-protocol

      # Separate steps, HTML first, deliberately. They exercise different halves
      # of the feature — HTML harvests the runtime stylesheet, PDF drives the
      # platform print pipeline — and running them together meant one failure
      # hid the other's result entirely. HTML leads because it is the half that
      # shares no code with the three native print backends.
      - name: Export HTML
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail
          # GTK needs a display; the other two runners already have a window
          # server session.
          if [ "${{ matrix.platform }}" = "ubuntu-22.04" ]; then
            xvfb-run -a target/release/slideflare export html ../examples/example.md -o out.html
          elif [ "${{ matrix.platform }}" = "windows-latest" ]; then
            target/release/slideflare.exe export html ../examples/example.md -o out.html
          else
            target/release/slideflare export html ../examples/example.md -o out.html
          fi

      - name: Export PDF
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "ubuntu-22.04" ]; then
            xvfb-run -a target/release/slideflare export pdf ../examples/example.md -o out.pdf
          elif [ "${{ matrix.platform }}" = "windows-latest" ]; then
            target/release/slideflare.exe export pdf ../examples/example.md -o out.pdf
          else
            target/release/slideflare export pdf ../examples/example.md -o out.pdf
          fi

      # Tier 3, assertion 1, on every platform. A file that exists but is blank
      # is the dangerous failure mode, so size alone is not sufficient — but it
      # is the only check that is trivial on all three runners.
      - name: Check the exports are not trivial
        # Tier 3, assertion 1. `always()` so a broken PDF on one platform does
        # not also hide whether its HTML export was fine — each file is only
        # judged if the step that makes it got as far as writing one.
        if: always()
        working-directory: src-tauri
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for f in out.html out.pdf; do
            if [ ! -f "$f" ]; then
              echo "$f: not produced"
              continue
            fi
            size=$(wc -c < "$f")
            echo "$f: $size bytes"
            if [ "$size" -le 100000 ]; then
              echo "::error::$f is suspiciously small"
              status=1
            fi
          done
          exit $status

      # Tier 3, assertions 2 and 3. Linux only, because that is the runner with
      # poppler available without fuss. A page count that drifts from the slide
      # count, or a MediaBox that is not exactly the design resolution, both mean
      # the print pipeline has stopped matching the deck.
      - name: Check the PDF structure
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail

          slides=$(target/release/slideflare validate ../examples/example.md | grep -oE '[0-9]+')
          pages=$(pdfinfo out.pdf | awk '/^Pages:/ { print $2 }')
          echo "slides=$slides pages=$pages"
          [ "$slides" = "$pages" ] \
            || { echo "::error::page count $pages does not match slide count $slides"; exit 1; }

          pdfinfo out.pdf | grep -qE '^Page size: +960 x 540 pts' \
            || { echo "::error::unexpected page size"; pdfinfo out.pdf | grep '^Page size'; exit 1; }

      # Tier 3, assertion 4, and the one that matters most on Windows and macOS.
      #
      # Everything above this point passes for a deck that rendered *wrongly*.
      # The failure mode the windowless export risks is not an error: an engine
      # that decides the render surface is hidden lays replaced elements out at
      # zero height, the deck measures short, one fitScale is derived for the
      # whole document from those measurements, and every slide prints
      # over-sized and clipped — right page count, right page size, plausible
      # file size, exit code 0.
      #
      # So the deck is rendered twice on the same runner: once the normal
      # windowless way, once with SLIDEFLARE_EXPORT_WINDOW=visible, which puts
      # back the realized window every platform used to use. The two are
      # required to rasterize identically. A reference generated by the same
      # engine, fonts and machine is the only reference worth having — a
      # committed PNG could not be, since text rasterizes differently on every
      # platform and on any two runner images.
      #
      # intro-to-slideflare.md rather than example.md, deliberately: example.md
      # has a <video> whose layout depends on whether the media pipeline has
      # reported metadata by print time, and an offscreen GTK window never
      # starts one. That is a real difference between the two modes (see
      # TODO.md), not a regression this gate should be reporting.
      - name: Render the fidelity deck both ways
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.platform }}" in
            ubuntu-22.04) run() { xvfb-run -a target/release/slideflare "$@"; } ;;
            windows-latest) run() { target/release/slideflare.exe "$@"; } ;;
            *) run() { target/release/slideflare "$@"; } ;;
          esac

          run export pdf ../examples/intro-to-slideflare.md -o fidelity-windowless.pdf

          export SLIDEFLARE_EXPORT_WINDOW=visible
          run export pdf ../examples/intro-to-slideflare.md -o fidelity-windowed.pdf

      - name: Check the windowless render is pixel-identical
        working-directory: src-tauri
        shell: bash
        run: |
          set -euo pipefail
          python ../scripts/pdf-pixel-diff.py \
            fidelity-windowless.pdf fidelity-windowed.pdf \
            --dpi 150 --out fidelity-diff

      - name: Upload the fidelity difference
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fidelity-diff-${{ matrix.platform }}
          path: src-tauri/fidelity-diff
          if-no-files-found: ignore

      # Kept so a failure can be inspected rather than only read about.
      - name: Upload the exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exports-${{ matrix.platform }}
          path: |
            src-tauri/out.pdf
            src-tauri/out.html
          if-no-files-found: warn
